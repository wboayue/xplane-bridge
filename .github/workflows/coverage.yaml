name: coverage

on:
  workflow_run:
    workflows:
      - ci
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: install tarpaulin
      run: command -v cargo-tarpaulin || cargo install cargo-tarpaulin --locked

    - name: coverage
      run: cargo tarpaulin --engine llvm --follow-exec --all-features --coveralls ${{ secrets.COVERALLS_REPO_TOKEN }}
